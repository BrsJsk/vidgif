name: Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo clippy --locked -p vidgif-app --target wasm32-unknown-unknown --lib --bins -- -D warnings
      - name: Build
        working-directory: crates/vidgif-app
        run: trunk build --release
      # Download this from the run page and upload it to Cloudflare Pages.
      - uses: actions/upload-artifact@v4
        with:
          name: vidgif-web
          path: crates/vidgif-app/dist
          if-no-files-found: error
