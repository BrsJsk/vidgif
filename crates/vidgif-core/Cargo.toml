[package]
name = "vidgif-core"
version.workspace = true
edition.workspace = true

[dependencies]
color_quant = "2.0.0"
gif = "0.14.2"
rayon = { version = "1.12.0", optional = true }

[features]
default = ["parallel"]
# Multi-threaded row processing; disable for single-threaded targets (wasm).
parallel = ["dep:rayon"]
