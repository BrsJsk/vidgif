[package]
name = "vidgif-app"
version.workspace = true
edition.workspace = true

[dependencies]
egui = "0.36.2"
gif = "0.14.2"
vidgif-core = { version = "0.1.0", path = "../vidgif-core", default-features = false }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
rfd = "0.17.2"
vidgif-core = { version = "0.1.0", path = "../vidgif-core", features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Document", "DragEvent", "Element",
    "Event", "EventTarget", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement",
    "HtmlInputElement", "HtmlVideoElement", "ImageData", "MessageEvent", "Url", "Window",
    "Worker", "WorkerOptions", "WorkerType", "DedicatedWorkerGlobalScope", "AddEventListenerOptions",
    "HtmlElement", "CssStyleDeclaration",
    "MediaError", "HtmlCollection", "Node",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "vidgif-app"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"
